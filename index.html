<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0A0908" />
    <title>Studio D13 — Muh Aldi Triantama</title>
    <meta name="description" content="Graphic designer & web developer berbasis di Palu, Sulawesi Tengah. Branding, UI/UX, dan produk digital yang membantu bisnis Anda tumbuh." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Curated font pairs available in Developer Mode → Tampilan. All loaded up front so switching is instant. -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- Inline fallback so the very first paint is already dark, even before
         the bundled stylesheet finishes loading on a slow connection. -->
    <style>
      html, body { background: #0A0908; margin: 0; }
      #boot-fallback {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #0A0908; color: #C9A96A; font: 500 0.8rem/1 'DM Sans', sans-serif;
        letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.85;
      }
      @keyframes boot-pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.9; } }
      #boot-fallback span { animation: boot-pulse 1.4s ease-in-out infinite; }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Replaced automatically the instant React mounts (Home/DynamicPage
           then take over with their own skeleton while data loads). -->
      <div id="boot-fallback"><span>Studio D13</span></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
